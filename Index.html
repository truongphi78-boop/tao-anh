<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Batch Image Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 80px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    input, textarea, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      color: var(--text);
      font-size: 1rem;
    }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .row > div { flex: 1; }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
    }
    .progress { margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
    .progress-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .result-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .result-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #0f172a;
    }
    .result-item .info { padding: 10px; }
    .result-item .word {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-item .meaning {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .result-item button { padding: 8px; font-size: 0.8rem; }
    .error {
      background: #450a0a;
      border: 1px solid var(--danger);
      color: #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.9rem;
    }
    .status { text-align: center; color: var(--muted); padding: 24px; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Batch Image Generator</h1>
  <p class="subtitle">Gemini + Hugging Face • Cute Cartoon</p>

  <div class="card">
    <label for="providerSelect">Nhà cung cấp tạo ảnh</label>
    <select id="providerSelect">
      <option value="gemini">Gemini (Google)</option>
      <option value="hf">Hugging Face</option>
    </select>

    <div style="margin-top: 14px;">
      <label for="apiKey">API Key Gemini</label>
      <input type="password" id="apiKey" placeholder="AIza..." />
    </div>

    <div style="margin-top: 14px;">
      <label for="hfToken">Hugging Face Token</label>
      <input type="password" id="hfToken" placeholder="hf_..." />
      <p class="hint">Lấy token tại huggingface.co/settings/tokens (quyền Read)</p>
    </div>
  </div>

  <div class="card">
    <label for="wordList">Danh sách từ (mỗi dòng một từ)</label>
    <textarea id="wordList" placeholder="Dog&#10;Cat - con mèo"></textarea>
  </div>

  <div class="card">
    <label for="stylePrompt">Prompt phong cách</label>
    <textarea id="stylePrompt">cute cartoon style, simple, adorable, bright colors, clean background, no text, chibi illustration</textarea>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label for="aspectRatio">Tỉ lệ (Gemini)</label>
        <select id="aspectRatio">
          <option value="1:1">1:1 Vuông</option>
          <option value="9:16">9:16 Dọc</option>
          <option value="16:9">16:9 Ngang</option>
        </select>
      </div>
      <div>
        <label for="imageSize">Độ phân giải</label>
        <select id="imageSize">
          <option value="320">320px</option>
          <option value="512">512px</option>
          <option value="1K">1K</option>
        </select>
      </div>
    </div>

    <div style="margin-top: 12px;">
      <label for="exportFormat">Định dạng tải về</label>
      <select id="exportFormat">
        <option value="png">PNG</option>
        <option value="jpeg10">JPEG 1.0</option>
        <option value="jpeg09">JPEG 0.9</option>
        <option value="jpeg08">JPEG 0.8</option>
        <option value="jpeg07">JPEG 0.7</option>
        <option value="jpeg06" selected>JPEG 0.6</option>
        <option value="jpeg05">JPEG 0.5</option>
      </select>
    </div>
  </div>

  <button id="generateBtn">Tạo ảnh hàng loạt</button>
  <button id="stopBtn" class="secondary" style="display:none">Dừng</button>

  <div id="progressArea" class="card" style="display:none">
    <div class="progress" id="progressText">Đang chuẩn bị...</div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressBar"></div></div>
  </div>

  <div id="errorArea"></div>
  <div id="results"></div>
  <div id="emptyState" class="status">Chưa có ảnh</div>

  <script>
    let shouldStop = false;

    const providerSelect = document.getElementById('providerSelect');
    const apiKeyInput = document.getElementById('apiKey');
    const hfTokenInput = document.getElementById('hfToken');
    const wordListInput = document.getElementById('wordList');
    const stylePromptInput = document.getElementById('stylePrompt');
    const aspectRatioSelect = document.getElementById('aspectRatio');
    const imageSizeSelect = document.getElementById('imageSize');
    const exportFormatSelect = document.getElementById('exportFormat');
    const generateBtn = document.getElementById('generateBtn');
    const stopBtn = document.getElementById('stopBtn');
    const progressArea = document.getElementById('progressArea');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');
    const errorArea = document.getElementById('errorArea');
    const results = document.getElementById('results');
    const emptyState = document.getElementById('emptyState');

    // Load keys
    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    hfTokenInput.value = localStorage.getItem('hf_token') || '';

    apiKeyInput.addEventListener('change', function() {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });
    hfTokenInput.addEventListener('change', function() {
      localStorage.setItem('hf_token', hfTokenInput.value.trim());
    });

    function parseWordList(text) {
      return text.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l.length > 0; })
        .map(function(line) {
          var idx = line.indexOf(' - ');
          if (idx === -1) return { english: line, meaning: '' };
          return {
            english: line.slice(0, idx).trim(),
            meaning: line.slice(idx + 3).trim()
          };
        });
    }

    function buildPrompt(item, style) {
      var p = style.trim() || 'cute cartoon style, simple, adorable, bright colors, clean background, no text';
      p += ', illustration of "' + item.english + '"';
      if (item.meaning) p += ' (meaning: ' + item.meaning + ')';
      p += ', no text, no letters';
      return p;
    }

    async function generateGemini(key, prompt, ratio, size) {
      var url = 'https://generativelanguage.googleapis.com/v1beta/interactions?key=' + key;
      var res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'gemini-3.1-flash-image',
          input: prompt,
          response_format: { type: 'image', aspect_ratio: ratio, image_size: size }
        })
      });
      if (!res.ok) {
        var err = await res.json().catch(function(){return {};});
        throw new Error((err.error && err.error.message) || ('HTTP ' + res.status));
      }
      var data = await res.json();
      var base64 = null, mime = 'image/png';
      if (data.output_image && data.output_image.data) {
        base64 = data.output_image.data;
        mime = data.output_image.mime_type || 'image/png';
      } else if (data.steps) {
        for (var i = 0; i < data.steps.length; i++) {
          var step = data.steps[i];
          if (step.type === 'model_output' && step.content) {
            for (var j = 0; j < step.content.length; j++) {
              if (step.content[j].type === 'image' && step.content[j].data) {
                base64 = step.content[j].data;
                mime = step.content[j].mime_type || 'image/png';
                break;
              }
            }
          }
          if (base64) break;
        }
      }
      if (!base64) throw new Error('Không nhận được ảnh Gemini');
      return { base64: base64, mimeType: mime };
    }

    async function generateHF(token, prompt) {
      var res = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          inputs: prompt,
          parameters: { num_inference_steps: 4 }
        })
      });
      if (!res.ok) {
        var t = await res.text();
        throw new Error('HF ' + res.status + ': ' + t.slice(0, 150));
      }
      var blob = await res.blob();
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onloadend = function() {
          resolve({
            base64: reader.result.split(',')[1],
            mimeType: blob.type || 'image/jpeg'
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function processImage(base64, mime, maxSize, quality) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        img.onload = function() {
          var w = img.width, h = img.height;
          if (maxSize && (w > maxSize || h > maxSize)) {
            if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
            else { w = Math.round(w * maxSize / h); h = maxSize; }
          }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(quality === null ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = 'data:' + mime + ';base64,' + base64;
      });
    }

    function getExport() {
      var v = exportFormatSelect.value;
      if (v === 'png') return { q: null, ext: '.png' };
      if (v === 'jpeg10') return { q: 1.0, ext: '.jpg' };
      if (v === 'jpeg09') return { q: 0.9, ext: '.jpg' };
      if (v === 'jpeg08') return { q: 0.8, ext: '.jpg' };
      if (v === 'jpeg07') return { q: 0.7, ext: '.jpg' };
      if (v === 'jpeg06') return { q: 0.6, ext: '.jpg' };
      if (v === 'jpeg05') return { q: 0.5, ext: '.jpg' };
      return { q: 0.6, ext: '.jpg' };
    }

    function showError(msg) {
      errorArea.innerHTML = '<div class="error">' + msg + '</div>';
    }

    function addResult(item, imgObj, targetSize) {
      emptyState.style.display = 'none';
      var src = 'data:' + imgObj.mimeType + ';base64,' + imgObj.base64;
      var name = item.english.replace(/[^a-z0-9]/gi, '_');

      var div = document.createElement('div');
      div.className = 'result-item';

      var img = document.createElement('img');
      img.src = src;
      img.alt = item.english;

      var info = document.createElement('div');
      info.className = 'info';

      var w = document.createElement('div');
      w.className = 'word';
      w.textContent = item.english;

      var m = document.createElement('div');
      m.className = 'meaning';
      m.textContent = item.meaning || '—';

      var btn = document.createElement('button');
      btn.textContent = 'Tải về';
      btn.onclick = function() {
        var exp = getExport();
        var max = targetSize === 320 ? 320 : null;
        processImage(imgObj.base64, imgObj.mimeType, max, exp.q)
          .then(function(url) {
            var a = document.createElement('a');
            a.href = url;
            a.download = name + exp.ext;
            a.click();
          })
          .catch(function() {
            var a = document.createElement('a');
            a.href = src;
            a.download = name + '.png';
            a.click();
          });
      };

      info.appendChild(w);
      info.appendChild(m);
      info.appendChild(btn);
      div.appendChild(img);
      div.appendChild(info);
      results.prepend(div);
    }

    async function startGenerate() {
      errorArea.innerHTML = '';
      var items = parseWordList(wordListInput.value);
      if (!items.length) {
        showError('Nhập ít nhất 1 từ');
        return;
      }

      var provider = providerSelect.value;

      if (provider === 'gemini' && !apiKeyInput.value.trim()) {
        showError('Bạn đang chọn Gemini → vui lòng nhập API Key Gemini');
        return;
      }
      if (provider === 'hf' && !hfTokenInput.value.trim()) {
        showError('Bạn đang chọn Hugging Face → vui lòng nhập Hugging Face Token');
        return;
      }

      var style = stylePromptInput.value;
      var ratio = aspectRatioSelect.value;
      var sizeSel = imageSizeSelect.value;
      var apiSize = sizeSel === '320' ? '512' : sizeSel;

      shouldStop = false;
      generateBtn.disabled = true;
      stopBtn.style.display = 'block';
      stopBtn.disabled = false;
      progressArea.style.display = 'block';
      results.innerHTML = '';
      emptyState.style.display = 'none';

      var ok = 0;
      for (var i = 0; i < items.length; i++) {
        if (shouldStop) break;
        var item = items[i];
        progressBar.style.width = Math.round((i+1)/items.length*100) + '%';
        progressText.textContent = 'Đang tạo ' + (i+1) + '/' + items.length + ': ' + item.english;

        try {
          var prompt = buildPrompt(item, style);
          var imgObj;

          if (provider === 'gemini') {
            imgObj = await generateGemini(apiKeyInput.value.trim(), prompt, ratio, apiSize);
          } else {
            imgObj = await generateHF(hfTokenInput.value.trim(), prompt);
          }

          addResult(item, imgObj, sizeSel === '320' ? 320 : null);
          ok++;
        } catch (e) {
          console.error(e);
          showError('Lỗi "' + item.english + '": ' + e.message);
        }

        if (i < items.length - 1 && !shouldStop) {
          await new Promise(function(r){ setTimeout(r, provider === 'hf' ? 1600 : 800); });
        }
      }

      generateBtn.disabled = false;
      stopBtn.style.display = 'none';
      progressText.textContent = shouldStop
        ? 'Đã dừng. Thành công ' + ok + '/' + items.length
        : 'Hoàn thành! ' + ok + '/' + items.length + ' ảnh';
      progressBar.style.width = '100%';
    }

    generateBtn.addEventListener('click', startGenerate);
    stopBtn.addEventListener('click', function() {
      shouldStop = true;
      stopBtn.disabled = true;
      progressText.textContent = 'Đang dừng...';
    });
  </script>
</body>
</html>
